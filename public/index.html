<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriBot - AI Calorie Tracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
    }
    h1 { color: #10b981; margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🥗 NutriBot API</h1>
    <p>Backend & Telegram Webhook Serverless Function is active.</p>
    <div class="badge">● Status: Operational</div>
  </div>
</body>
</html>
