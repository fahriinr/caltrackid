<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalTrack (Cal) - AI Calorie Tracker</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: #1e293b;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        max-width: 480px;
        width: 100%;
      }
      h1 {
        color: #10b981;
        margin-bottom: 8px;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 12px;
      }
      .btn-dashboard {
        display: inline-block;
        margin-top: 24px;
        background: #10b981;
        color: #0f172a;
        padding: 10px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        transition: background 0.2s;
      }
      .btn-dashboard:hover {
        background: #059669;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🥗 CalTrack (Cal) API</h1>
      <p>Backend & Telegram Webhook Serverless Function is active.</p>
      <div class="badge">● Status: Operational</div>
      <div>
        <a href="/dashboard.html" class="btn-dashboard"
          >Buka Admin Dashboard &rarr;</a
        >
      </div>
    </div>
  </body>
</html>
